<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audit Dokumen Kapal - Waruna Group</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #fffbeb; }
        .header-gradient { background: linear-gradient(90deg, #fef3c7 0%, #fde68a 100%); }
        .btn-waruna { background-color: #4c1d95; transition: all 0.3s ease; }
        .btn-waruna:hover { background-color: #5b21b6; transform: translateY(-1px); }
        .card-container { border-top: 4px solid #f59e0b; }
        .item-card { border-left: 4px solid #4c1d95; }
        .doc-badge { background-color: #4c1d95; color: white; }
    </style>
</head>
<body class="min-h-screen font-sans text-slate-800">
    <div class="max-w-5xl mx-auto py-10 px-4">
        <div class="bg-white shadow-xl rounded-xl overflow-hidden card-container">
            <!-- Header -->
            <div class="header-gradient px-8 py-6 border-b border-amber-200">
                <h1 class="text-2xl font-bold text-amber-900 tracking-tight">Audit Dokumen Kapal</h1>
                <p class="text-amber-700 text-sm mt-1 font-medium italic">Fokus Audit: Kelengkapan Dokumen & Temuan Anomali</p>
            </div>

            <div class="p-8">
                <form id="auditForm" class="space-y-6">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <!-- Input Sertifikat -->
                        <div class="space-y-2">
                            <label class="block text-sm font-bold text-slate-700 uppercase tracking-wide">Laporan Sertifikat</label>
                            <div class="relative border-2 border-dashed border-amber-200 rounded-lg p-6 hover:bg-amber-50 transition-all text-center">
                                <input id="file_sertifikat" type="file" accept=".pdf" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer" required>
                                <div class="text-amber-600">
                                    <svg class="mx-auto h-10 w-10 mb-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"/></svg>
                                    <span class="text-xs font-bold" id="name_sertifikat">UNGGAH SERTIFIKAT</span>
                                </div>
                            </div>
                        </div>

                        <!-- Input Penawaran -->
                        <div class="space-y-2">
                            <label class="block text-sm font-bold text-slate-700 uppercase tracking-wide">Penawaran Vendor</label>
                            <div class="relative border-2 border-dashed border-amber-200 rounded-lg p-6 hover:bg-amber-50 transition-all text-center">
                                <input id="file_penawaran" type="file" accept=".pdf" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer" required>
                                <div class="text-amber-600">
                                    <svg class="mx-auto h-10 w-10 mb-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"/></svg>
                                    <span class="text-xs font-bold" id="name_penawaran">UNGGAH PENAWARAN</span>
                                </div>
                            </div>
                        </div>
                    </div>

                    <button type="submit" id="submitBtn" class="w-full btn-waruna text-white font-bold py-4 rounded-lg shadow-md uppercase tracking-widest text-xs">
                        Jalankan Proses Audit Ekstraksi
                    </button>
                </form>

                <!-- Hasil Audit -->
                <div id="resultContainer" class="mt-12 hidden">
                    <!-- Bagian 1: Inventarisasi Dokumen -->
                    <section class="mb-10">
                        <h2 class="text-sm font-black text-purple-900 mb-4 uppercase tracking-widest flex items-center">
                            <span class="bg-purple-900 text-white p-1 rounded mr-2">01</span> 
                            Inventarisasi Kelengkapan Dokumen
                        </h2>
                        <div id="docInventory" class="flex flex-wrap gap-2"></div>
                    </section>

                    <!-- Bagian 2: Temuan Khusus -->
                    <section>
                        <h2 class="text-sm font-black text-red-700 mb-4 uppercase tracking-widest flex items-center">
                            <span class="bg-red-700 text-white p-1 rounded mr-2">02</span> 
                            Anomali & Temuan Audit (Hanya Masalah)
                        </h2>
                        <div id="outputResult" class="space-y-4"></div>
                    </section>
                </div>
            </div>
        </div>
        <p class="text-center text-slate-400 text-[10px] mt-6 font-bold uppercase tracking-widest">© 2026 Waruna Group Audit Terminal</p>
    </div>

    <script>
        const WEBHOOK_URL = 'https://n8.waruna-group.co.id/webhook/audit-dokumen';

        document.getElementById('file_sertifikat').addEventListener('change', e => {
            document.getElementById('name_sertifikat').textContent = e.target.files[0].name.toUpperCase();
        });
        document.getElementById('file_penawaran').addEventListener('change', e => {
            document.getElementById('name_penawaran').textContent = e.target.files[0].name.toUpperCase();
        });

        document.getElementById('auditForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            const resultContainer = document.getElementById('resultContainer');
            const outputResult = document.getElementById('outputResult');
            const docInventory = document.getElementById('docInventory');

            const formData = new FormData();
            formData.append('sertifikat', document.getElementById('file_sertifikat').files[0]);
            formData.append('penawaran', document.getElementById('file_penawaran').files[0]);

            btn.disabled = true;
            btn.innerHTML = `<span class="animate-pulse">MENGANALISIS DATA...</span>`;
            resultContainer.classList.add('hidden');

            try {
                const response = await fetch(WEBHOOK_URL, { method: 'POST', body: formData });
                const data = await response.json();
                
                // Render Inventarisasi Dokumen
                docInventory.innerHTML = data.daftar_dokumen.map(doc => `
                    <span class="text-[10px] font-bold border border-purple-200 px-3 py-1.5 rounded-full bg-purple-50 text-purple-900 uppercase">
                        ✓ ${doc}
                    </span>
                `).join('');

                // Render Temuan (Hanya yang tidak match/aneh)
                if (data.temuan && data.temuan.length > 0) {
                    outputResult.innerHTML = data.temuan.map(t => `
                        <div class="bg-white p-5 rounded-xl border border-red-100 shadow-sm item-card transition-all hover:shadow-md">
                            <div class="flex justify-between items-start mb-3">
                                <h4 class="font-black text-slate-900 text-sm uppercase tracking-tight">${t.item}</h4>
                                <div class="text-right">
                                    <span class="block text-[9px] font-black text-red-600 uppercase mb-1">Ditemukan di:</span>
                                    <span class="text-[10px] bg-red-100 px-2 py-1 rounded font-bold text-red-700">${t.referensi_dokumen}</span>
                                </div>
                            </div>
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-3 text-[12px] mb-4">
                                <div class="p-3 bg-slate-50 rounded border border-slate-100">
                                    <span class="block text-[9px] font-bold text-slate-400 uppercase mb-1">Data Penawaran</span>
                                    <p class="font-medium text-slate-700">${t.di_penawaran}</p>
                                </div>
                                <div class="p-3 bg-slate-50 rounded border border-slate-100">
                                    <span class="block text-[9px] font-bold text-slate-400 uppercase mb-1">Data Sertifikat</span>
                                    <p class="font-medium text-slate-700">${t.di_sertifikat}</p>
                                </div>
                            </div>
                            <div class="p-4 bg-amber-50 rounded-lg border border-amber-200">
                                <p class="text-xs font-bold text-amber-900 leading-relaxed">
                                    <span class="text-amber-600 mr-1 underline">ANALISIS AUDITOR:</span> ${t.analisis}
                                </p>
                            </div>
                        </div>
                    `).join('');
                } else {
                    outputResult.innerHTML = `<div class="p-8 text-center bg-green-50 border-2 border-dashed border-green-200 rounded-xl">
                        <p class="text-green-700 font-bold uppercase tracking-widest text-xs">Semua Data Sesuai (No Discrepancies)</p>
                    </div>`;
                }

                resultContainer.classList.remove('hidden');
                
            } catch (error) {
                outputResult.innerHTML = `<div class="p-4 bg-red-600 text-white font-bold rounded-lg text-xs uppercase tracking-widest">Gagal Memproses: ${error.message}</div>`;
                resultContainer.classList.remove('hidden');
            } finally {
                btn.disabled = false;
                btn.textContent = 'JALANKAN PROSES AUDIT EKSTRAKSI';
            }
        });
    </script>
</body>
</html>
