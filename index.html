<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Waruna Group | Smart Audit LSA V7</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #1e3a8a; --primary-light: #eff6ff; --border-color: #e2e8f0; --text-main: #1e293b; --text-muted: #64748b; --success: #15803d; --error: #b91c1c; --bg-vendor: #fef9c3; --border-vendor: #facc15; --bg-system: #e0f2fe; --border-system: #7dd3fc; --bg-code: #f0fdf4; --border-code: #86efac; }
        body { font-family: 'Inter', sans-serif; font-size: 11px; color: var(--text-main); background: #f1f5f9; margin: 0; padding: 0; line-height: 1.3; }
        * { box-sizing: border-box; }
        #upload-section { max-width: 900px; margin: 40px auto; padding: 20px; background: #fff; border-radius: 12px; border: 1px solid var(--border-color); }
        .upload-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; margin-bottom: 20px; }
        .upload-zone { border: 2px dashed #cbd5e1; border-radius: 8px; padding: 15px; text-align: center; background: #f8fafc; }
        .btn-run { width: 100%; background: var(--primary); color: #fff; font-weight: 800; padding: 12px; border-radius: 8px; border: none; cursor: pointer; }
        #dashboard-section { display: none; padding: 15px; max-width: 1300px; margin: 0 auto; }
        .nav-item { padding: 12px 15px; background: #fff; border: 1px solid var(--border-color); border-radius: 6px; font-weight: 600; cursor: pointer; margin-bottom: 5px; }
        .nav-item.active { background: var(--primary); color: #fff; }
        .content-card { display: none; background: #fff; border: 1px solid var(--border-color); }
        .content-card.active { display: block; }
        table { border-collapse: collapse; width: 100%; }
        th { background-color: var(--primary-light); padding: 8px; text-align: left; border: 1px solid var(--border-color); }
        td { border: 1px solid var(--border-color); padding: 6px; }
        .section-title td { background-color: var(--primary); color: white; font-weight: 700; }
        .explanation-row td { background-color: #f8fafc; }
    </style>
</head>
<body>

<div id="upload-section">
    <h1>Waruna LSA Audit - V7 Final</h1>
    <div class="upload-grid">
        <div class="upload-zone"><input type="file" id="file-penawaran" accept="application/pdf"></div>
        <div class="upload-zone"><input type="file" id="file-sertifikat" accept="application/pdf"></div>
        <div class="upload-zone"><input type="file" id="file-do" accept="application/pdf"></div>
    </div>
    <button type="button" id="btn-run" class="btn-run">RUN AUDIT</button>
</div>

<div id="dashboard-section">
    <div class="main-layout" style="display:grid; grid-template-columns: 200px 1fr; gap:20px;">
        <aside class="sidebar">
            <div class="nav-item active" onclick="switchTab('tab-summary', this)">Summary</div>
            <div class="nav-item" onclick="switchTab('tab-sertifikat', this)">Certificate</div>
            <div class="nav-item" onclick="switchTab('tab-penawaran', this)">Quotation</div>
        </aside>
        <main>
            <div id="tab-summary" class="content-card active"><div id="critical-summary-container"></div></div>
            <div id="tab-sertifikat" class="content-card"><table><tbody id="body-sertifikat"></tbody></table></div>
            <div id="tab-penawaran" class="content-card"><table><tbody id="body-penawaran"></tbody></table></div>
        </main>
    </div>
</div>

<script>
function switchTab(tabId, el) {
    document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
    el.classList.add('active');
    document.querySelectorAll('.content-card').forEach(c => c.classList.remove('active'));
    document.getElementById(tabId).classList.add('active');
}

function esc(s){ return String(s||"-").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

function renderAuditReport(parsed) {
    if (!parsed.tabel_audit) return;
    let certRows = [], penRows = [];
    
    // PEMISAHAN OTOMATIS
    parsed.tabel_audit.forEach(r => {
        let certContent = String(r.di_sertifikat || "").toLowerCase();
        let isCertData = certContent.includes("certno:") || certContent.includes("imo:") || certContent.includes("page:");
        let isBarangFisik = String(r.keterangan || "").toLowerCase().match(/unit|pack|cyl|pc|set|lot/);
        if (isCertData && !isBarangFisik) certRows.push(r); else penRows.push(r);
    });

    // RENDER PENAWARAN
    let htmlPen = "";
    penRows.forEach((r, idx) => {
        htmlPen += `<tr><td>${idx+1}</td><td>${esc(r.keterangan)}</td><td>${esc(r.di_penawaran)}</td><td>${esc(r.di_sertifikat)}</td><td>${esc(r.di_do)}</td><td>${esc(r.hasil_ai)}</td></tr>`;
    });
    document.getElementById("body-penawaran").innerHTML = htmlPen;

    // RENDER SERTIFIKAT
    let htmlCert = "";
    certRows.forEach((r, idx) => {
        htmlCert += `<tr><td>${idx+1}</td><td>${esc(r.keterangan)}</td><td>${esc(r.di_sertifikat)}</td></tr>`;
    });
    document.getElementById("body-sertifikat").innerHTML = htmlCert;
}
</script>
</body>
</html>
