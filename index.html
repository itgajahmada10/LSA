<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Waruna Group | Verifikasi Dokumen</title>
    <!-- Menggunakan Tailwind CSS via CDN sesuai dengan environment Anda -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #fdfbf3; }
        .dashed-box { border: 2px dashed #f6e05e; background-color: #fff; transition: all 0.3s ease; }
        .dashed-box:hover { background-color: #fefcbf; border-color: #d69e2e; }
    </style>
</head>
<body class="text-gray-800 antialiased min-h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-white shadow-sm px-6 py-4 flex items-center gap-3">
        <div class="bg-indigo-900 text-white w-8 h-8 flex items-center justify-center rounded font-bold text-lg">W</div>
        <h1 class="text-xl font-bold text-yellow-600 tracking-wide">Waruna Group <span class="text-gray-400 font-normal">| Verifikasi Dokumen</span></h1>
    </header>

    <!-- Main Content -->
    <main class="flex-grow flex flex-col items-center py-10 px-4 w-full">
        
        <!-- Upload Card -->
        <div class="bg-white shadow-md rounded-xl p-8 w-full max-w-4xl border border-gray-100">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
                
                <!-- Input Sertifikat -->
                <div>
                    <label class="block text-xs font-bold text-gray-400 uppercase tracking-wider mb-2">Laporan Sertifikat</label>
                    <div class="relative dashed-box rounded-lg h-32 flex flex-col items-center justify-center cursor-pointer overflow-hidden" onclick="document.getElementById('file-sertifikat').click()">
                        <span id="label-sertifikat" class="text-sm font-bold text-yellow-700 text-center px-4">PILIH FILE PDF SERTIFIKAT</span>
                        <input type="file" id="file-sertifikat" accept="application/pdf" class="hidden" onchange="updateLabel('sertifikat')">
                    </div>
                </div>

                <!-- Input Penawaran -->
                <div>
                    <label class="block text-xs font-bold text-gray-400 uppercase tracking-wider mb-2">Penawaran Vendor</label>
                    <div class="relative dashed-box rounded-lg h-32 flex flex-col items-center justify-center cursor-pointer overflow-hidden" onclick="document.getElementById('file-penawaran').click()">
                        <span id="label-penawaran" class="text-sm font-bold text-yellow-700 text-center px-4">PILIH FILE PDF PENAWARAN</span>
                        <input type="file" id="file-penawaran" accept="application/pdf" class="hidden" onchange="updateLabel('penawaran')">
                    </div>
                </div>

            </div>

            <!-- Submit Button -->
            <button id="btn-submit" onclick="jalankanVerifikasi()" class="w-full bg-indigo-800 hover:bg-indigo-900 text-white font-bold py-4 px-6 rounded-lg uppercase tracking-wider transition duration-200 shadow-md">
                Jalankan Verifikasi Ekstraksi
            </button>
        </div>

        <!-- Loading Indicator -->
        <div id="loading" class="hidden mt-8 flex flex-col items-center">
            <svg class="animate-spin h-10 w-10 text-indigo-800 mb-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
            <p class="text-indigo-900 font-semibold animate-pulse">AI sedang membaca dan membandingkan dokumen. Harap tunggu...</p>
        </div>

        <!-- Error Container -->
        <div id="error-container" class="hidden w-full max-w-5xl mt-6 p-4 bg-red-100 border-l-4 border-red-600 text-red-800 font-medium rounded shadow-sm">
        </div>

        <!-- Result Container -->
        <div id="result-container" class="w-full max-w-5xl mt-8">
            <!-- Hasil JSON akan dirender di sini -->
        </div>

    </main>

    <!-- JavaScript Logic -->
    <script>
        // Update label saat file dipilih
        function updateLabel(type) {
            const fileInput = document.getElementById(`file-${type}`);
            const label = document.getElementById(`label-${type}`);
            
            if (fileInput.files.length > 0) {
                label.innerText = fileInput.files[0].name.toUpperCase();
                label.classList.remove('text-yellow-700');
                label.classList.add('text-indigo-800');
            } else {
                label.innerText = `PILIH FILE PDF ${type.toUpperCase()}`;
                label.classList.add('text-yellow-700');
                label.classList.remove('text-indigo-800');
            }
        }

        // Fungsi utama pengiriman ke Webhook n8n
        async function jalankanVerifikasi() {
            const fileSertifikat = document.getElementById('file-sertifikat').files[0];
            const filePenawaran = document.getElementById('file-penawaran').files[0];
            const btnSubmit = document.getElementById('btn-submit');
            const loading = document.getElementById('loading');
            const resultContainer = document.getElementById('result-container');
            const errorContainer = document.getElementById('error-container');

            // Validasi Input
            if (!fileSertifikat || !filePenawaran) {
                alert("Kesalahan Objektif: Anda harus mengunggah kedua file (Sertifikat dan Penawaran) sebelum menjalankan verifikasi.");
                return;
            }

            // Siapkan UI untuk loading
            btnSubmit.disabled = true;
            btnSubmit.classList.add('opacity-50', 'cursor-not-allowed');
            btnSubmit.innerText = 'MEMPROSES...';
            loading.classList.remove('hidden');
            resultContainer.innerHTML = '';
            errorContainer.classList.add('hidden');

            // Siapkan FormData (Nama key WAJIB sama dengan di n8n: 'sertifikat' dan 'penawaran')
            const formData = new FormData();
            formData.append('sertifikat', fileSertifikat);
            formData.append('penawaran', filePenawaran);

            try {
                // Tembak Webhook n8n
                const response = await fetch('https://n8.waruna-group.co.id/webhook/audit-dokumen', {
                    method: 'POST',
                    body: formData
                });

                if (!response.ok) {
                    throw new Error(`Server merespons dengan status: ${response.status}. Pastikan CORS Webhook sudah dibuka.`);
                }

                const data = await response.json();
                
                // Cek jika array kosong atau format salah
                if (!data || data.length === 0) {
                    throw new Error('Data JSON kosong atau format respons dari n8n tidak valid.');
                }

                renderHasil(data[0]);

            } catch (error) {
                errorContainer.innerText = `Gagal memproses dokumen: ${error.message}`;
                errorContainer.classList.remove('hidden');
            } finally {
                // Kembalikan UI ke state awal
                btnSubmit.disabled = false;
                btnSubmit.classList.remove('opacity-50', 'cursor-not-allowed');
                btnSubmit.innerText = 'JALANKAN VERIFIKASI EKSTRAKSI';
                loading.classList.add('hidden');
            }
        }

        // Fungsi untuk merender JSON berjenjang ke HTML
        function renderHasil(result) {
            const container = document.getElementById('result-container');
            container.innerHTML = '';

            // Render Status Keseluruhan
            const isOk = result.status_keseluruhan !== 'DISCREPANCY_FOUND';
            const statusClass = isOk ? 'bg-green-100 text-green-800 border-green-500' : 'bg-red-100 text-red-800 border-red-500';
            const statusText = result.status_keseluruhan ? result.status_keseluruhan.replace(/_/g, ' ') : 'UNKNOWN STATUS';
            
            container.innerHTML += `
                <div class="p-5 mb-8 rounded-lg ${statusClass} border-l-4 shadow-sm text-center">
                    <h2 class="font-bold text-xl tracking-wide">STATUS AUDIT: ${statusText}</h2>
                </div>
            `;

            // Jika tidak ada verifikasi per kategori
            if (!result.verifikasi_per_kategori || result.verifikasi_per_kategori.length === 0) {
                container.innerHTML += `<p class="text-center text-gray-500">Tidak ada data kategori yang diekstrak.</p>`;
                return;
            }

            // Looping Kategori
            result.verifikasi_per_kategori.forEach(kategori => {
                const catIsOk = kategori.status_kategori === 'SESUAI';
                const catColor = catIsOk ? 'text-green-700 bg-green-50 px-3 py-1 rounded border border-green-200' : 'text-red-700 bg-red-50 px-3 py-1 rounded border border-red-200';
                
                let htmlKategori = `
                    <div class="mb-8 bg-white border border-gray-200 rounded-xl shadow-sm overflow-hidden">
                        <div class="bg-gray-50 px-5 py-4 border-b border-gray-200 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-2">
                            <h3 class="font-bold text-indigo-900 text-lg">${kategori.nama_kategori || 'Kategori Tidak Bernama'}</h3>
                            <span class="font-bold text-sm uppercase tracking-wider ${catColor}">
                                ${kategori.status_kategori ? kategori.status_kategori.replace(/_/g, ' ') : '-'}
                            </span>
                        </div>
                        <div class="overflow-x-auto">
                            <table class="min-w-full divide-y divide-gray-200">
                                <thead class="bg-gray-100">
                                    <tr>
                                        <th class="px-5 py-3 text-left text-xs font-bold text-gray-500 uppercase tracking-wider w-1/3">Item Penawaran</th>
                                        <th class="px-5 py-3 text-center text-xs font-bold text-gray-500 uppercase tracking-wider">Qty Penawaran</th>
                                        <th class="px-5 py-3 text-center text-xs font-bold text-gray-500 uppercase tracking-wider">Qty Sertifikat</th>
                                        <th class="px-5 py-3 text-left text-xs font-bold text-gray-500 uppercase tracking-wider w-1/3">Catatan Auditor</th>
                                    </tr>
                                </thead>
                                <tbody class="bg-white divide-y divide-gray-200">
                `;

                // Cek jika daftar temuan kosong
                if (!kategori.daftar_temuan || kategori.daftar_temuan.length === 0) {
                    htmlKategori += `<tr><td colspan="4" class="px-5 py-4 text-center text-gray-500 italic">Tidak ada item dalam kategori ini.</td></tr>`;
                } else {
                    // Looping Item di dalam Kategori
                    kategori.daftar_temuan.forEach(item => {
                        const isMatch = item.tipe_anomali === 'MATCH';
                        const rowClass = isMatch ? 'hover:bg-gray-50' : 'bg-red-50/50 hover:bg-red-50';
                        const icon = isMatch ? '<span class="text-green-600 text-lg leading-none mr-2">✅</span>' : '<span class="text-red-600 text-lg leading-none mr-2">❌</span>';

                        htmlKategori += `
                            <tr class="${rowClass} transition-colors">
                                <td class="px-5 py-4 text-sm text-gray-800 font-medium align-top">
                                    <div class="flex items-start">
                                        ${icon}
                                        <div>
                                            <span class="block">${item.item || '-'}</span>
                                            <div class="text-xs text-gray-500 mt-2 bg-gray-50 p-2 rounded border border-gray-100 font-normal">
                                                <span class="font-semibold text-gray-600">Kutipan Asli:</span><br> 
                                                <span class="italic">"${item.kutipan_verbatim || 'Tidak ada kutipan'}"</span>
                                            </div>
                                        </div>
                                    </div>
                                </td>
                                <td class="px-5 py-4 text-sm text-center font-bold text-gray-700 align-top pt-5">${item.di_penawaran || '-'}</td>
                                <td class="px-5 py-4 text-sm text-center font-bold ${isMatch ? 'text-green-600' : 'text-red-600'} align-top pt-5">${item.di_sertifikat || '-'}</td>
                                <td class="px-5 py-4 text-sm text-gray-700 leading-relaxed align-top pt-5">${item.catatan || '-'}</td>
                            </tr>
                        `;
                    });
                }

                htmlKategori += `
                                </tbody>
                            </table>
                        </div>
                    </div>
                `;
                
                container.innerHTML += htmlKategori;
            });
        }
    </script>
</body>
</html>
