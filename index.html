<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verifikasi Dokumen - Waruna Group</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { background-color: #FFFBEB; font-family: 'Inter', sans-serif; }
        .app-header { background-color: #FEF9C3; border-bottom: 1px solid #FEF08A; }
        .btn-purple { background-color: #4C1D95; transition: all 0.2s ease; }
        .btn-purple:hover { background-color: #5B21B6; transform: translateY(-1px); }
        .card-main { background: #FFFFFF; border-radius: 12px; border: 1px solid #FDE68A; }
        .section-tag { background-color: #4C1D95; color: white; padding: 2px 10px; border-radius: 4px; font-size: 11px; font-weight: 800; }
    </style>
</head>
<body class="text-slate-900">
    <nav class="app-header px-6 py-4 flex items-center justify-between shadow-sm">
        <div class="flex items-center gap-3">
            <div class="w-8 h-8 bg-purple-900 rounded-lg flex items-center justify-center">
                <span class="text-white font-black text-xs">W</span>
            </div>
            <h1 class="text-lg font-bold text-amber-900 tracking-tight">Waruna Group <span class="font-normal text-slate-500">| Verifikasi Dokumen</span></h1>
        </div>
    </nav>

    <main class="max-w-5xl mx-auto py-10 px-4">
        <div class="card-main shadow-lg p-8">
            <form id="verificationForm" class="space-y-8">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                    <div class="space-y-3">
                        <label class="text-[11px] font-black text-slate-400 uppercase tracking-widest">Laporan Sertifikat</label>
                        <div class="relative border-2 border-dashed border-amber-200 rounded-xl p-8 hover:bg-amber-50/50 transition-all text-center">
                            <input id="file_sertifikat" type="file" accept=".pdf" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer" required>
                            <span class="text-xs font-bold text-amber-800 uppercase" id="name_sertifikat">Pilih File Sertifikat</span>
                        </div>
                    </div>
                    <div class="space-y-3">
                        <label class="text-[11px] font-black text-slate-400 uppercase tracking-widest">Penawaran Vendor</label>
                        <div class="relative border-2 border-dashed border-amber-200 rounded-xl p-8 hover:bg-amber-50/50 transition-all text-center">
                            <input id="file_penawaran" type="file" accept=".pdf" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer" required>
                            <span class="text-xs font-bold text-amber-800 uppercase" id="name_penawaran">Pilih File Penawaran</span>
                        </div>
                    </div>
                </div>
                <button type="submit" id="submitBtn" class="w-full btn-purple text-white font-bold py-4 rounded-xl shadow-lg uppercase tracking-widest text-[11px]">
                    Jalankan Verifikasi Ekstraksi
                </button>
            </form>

            <div id="resultContainer" class="mt-12 hidden space-y-10">
                <!-- 01 Inventarisasi -->
                <div>
                    <div class="flex items-center gap-3 mb-5">
                        <span class="section-tag">01</span>
                        <h2 class="text-[11px] font-black uppercase tracking-widest text-purple-900">Inventarisasi Kelengkapan Dokumen</h2>
                    </div>
                    <div id="docInventory" class="grid grid-cols-1 md:grid-cols-2 gap-3"></div>
                </div>

                <!-- 02 Temuan -->
                <div>
                    <div class="flex items-center gap-3 mb-5">
                        <span class="section-tag" style="background-color: #B91C1C;">02</span>
                        <h2 class="text-[11px] font-black uppercase tracking-widest text-red-700">Anomali & Temuan Verifikasi</h2>
                    </div>
                    <div id="outputResult" class="space-y-6"></div>
                </div>

                <!-- Rekomendasi -->
                <div id="recommendationBox" class="p-6 bg-blue-50 border-l-4 border-blue-600 rounded-r-xl">
                    <h3 class="text-[11px] font-black text-blue-800 uppercase tracking-widest mb-2">Rekomendasi Verifikator</h3>
                    <p id="recommendationText" class="text-sm text-blue-900 font-medium italic"></p>
                </div>
            </div>
        </div>
    </main>

    <script>
        const WEBHOOK_URL = 'https://n8.waruna-group.co.id/webhook/audit-dokumen';

        document.getElementById('file_sertifikat').addEventListener('change', e => { document.getElementById('name_sertifikat').textContent = e.target.files[0].name.toUpperCase(); });
        document.getElementById('file_penawaran').addEventListener('change', e => { document.getElementById('name_penawaran').textContent = e.target.files[0].name.toUpperCase(); });

        document.getElementById('verificationForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            const resultContainer = document.getElementById('resultContainer');
            const outputResult = document.getElementById('outputResult');
            const docInventory = document.getElementById('docInventory');
            const recommendationText = document.getElementById('recommendationText');

            const formData = new FormData();
            formData.append('sertifikat', document.getElementById('file_sertifikat').files[0]);
            formData.append('penawaran', document.getElementById('file_penawaran').files[0]);

            btn.disabled = true;
            btn.innerHTML = "MEMPROSES...";
            resultContainer.classList.add('hidden');

            try {
                const response = await fetch(WEBHOOK_URL, { method: 'POST', body: formData });
                const data = await response.json();
                
                // --- FUNGSI HELPER UNTUK CEK OBJEK ---
                const formatData = (obj) => {
                    if (!obj) return { v: "-", q: "N/A" };
                    if (typeof obj === 'string') return { v: obj, q: "Teks literal tidak tersedia" };
                    return { v: obj.nilai || "-", q: obj.kutipan_verbatim || "N/A" };
                };

                // 1. Inventarisasi
                const docs = data.daftar_dokumen || [];
                docInventory.innerHTML = docs.map(d => `
                    <div class="p-3 bg-amber-50 border border-amber-100 rounded-lg">
                        <span class="block text-[8px] font-black text-amber-600 uppercase mb-1">${typeof d === 'object' ? d.tipe : 'DOKUMEN'}</span>
                        <p class="text-xs font-bold text-amber-900">${typeof d === 'object' ? d.nama_dokumen : d}</p>
                    </div>
                `).join('');

                // 2. Temuan
                const temuan = data.temuan || [];
                outputResult.innerHTML = temuan.length > 0 ? temuan.map(t => {
                    const pen = formatData(t.di_penawaran);
                    const ser = formatData(t.di_sertifikat);
                    return `
                        <div class="bg-white rounded-xl border border-slate-200 shadow-sm border-l-4 border-l-purple-900 overflow-hidden">
                            <div class="p-6">
                                <div class="flex justify-between items-start mb-4">
                                    <h4 class="font-bold text-slate-900 text-sm uppercase">${t.item || 'Item'}</h4>
                                    <span class="text-[10px] bg-purple-50 px-2 py-1 rounded font-bold text-purple-700 italic">${t.referensi_dokumen || '-'}</span>
                                </div>
                                <div class="grid grid-cols-1 md:grid-cols-2 gap-4 text-[12px]">
                                    <div class="p-4 bg-slate-50 rounded-lg border border-slate-100">
                                        <span class="block text-[9px] font-black text-purple-800 uppercase mb-2">Penawaran</span>
                                        <p class="font-bold text-slate-800">${pen.v}</p>
                                        <p class="mt-2 text-[10px] text-slate-500 italic border-t pt-2">"${pen.q}"</p>
                                    </div>
                                    <div class="p-4 bg-slate-50 rounded-lg border border-slate-100">
                                        <span class="block text-[9px] font-black text-purple-800 uppercase mb-2">Sertifikat</span>
                                        <p class="font-bold text-slate-800">${ser.v}</p>
                                        <p class="mt-2 text-[10px] text-slate-500 italic border-t pt-2">"${ser.q}"</p>
                                    </div>
                                </div>
                                <div class="mt-4 p-4 bg-amber-50 rounded-lg border border-amber-200">
                                    <p class="text-[11px] font-bold text-amber-900 uppercase">Analisis Verifikator:</p>
                                    <p class="text-xs text-amber-800 leading-relaxed font-medium">${t.analisis || '-'}</p>
                                </div>
                            </div>
                        </div>
                    `;
                }).join('') : "<p class='text-center text-slate-400 italic text-sm'>Tidak ada anomali ditemukan.</p>";

                recommendationText.textContent = data.rekomendasi_tindakan || "-";
                resultContainer.classList.remove('hidden');
                
            } catch (error) {
                alert("Error: " + error.message);
            } finally {
                btn.disabled = false;
                btn.textContent = 'JALANKAN VERIFIKASI EKSTRAKSI';
            }
        });
    </script>
</body>
</html>
