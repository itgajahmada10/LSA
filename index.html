<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Audit LSA & APAR - Waruna Group</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .audit-table th { background-color: #f8fafc; }
        .status-match { background-color: #dcfce7; color: #166534; border: 1px solid #bbf7d0; }
        .status-discrepancy { background-color: #fee2e2; color: #991b1b; border: 1px solid #fecaca; }
    </style>
</head>
<body class="bg-gray-100 min-h-screen font-sans">
    <div class="max-w-5xl mx-auto py-10 px-4">
        <div class="bg-white shadow-xl rounded-xl overflow-hidden">
            <!-- Header -->
            <div class="bg-blue-700 px-8 py-6">
                <h1 class="text-2xl font-bold text-white">Sistem Audit Dokumen Kapal</h1>
                <p class="text-blue-100 text-sm mt-1">Rekonsiliasi Sertifikat Inspeksi vs Penawaran Vendor</p>
            </div>

            <div class="p-8">
                <form id="auditForm" class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <!-- Input Sertifikat -->
                    <div class="space-y-2">
                        <label class="block text-sm font-semibold text-gray-700">1. Sertifikat (Laporan Servis)</label>
                        <div class="relative border-2 border-dashed border-gray-300 rounded-lg p-4 hover:border-blue-500 transition-all text-center">
                            <input id="file_sertifikat" type="file" accept=".pdf" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer" required>
                            <div class="text-gray-500">
                                <svg class="mx-auto h-8 w-8 mb-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"/></svg>
                                <span class="text-xs" id="name_sertifikat">Pilih file PDF</span>
                            </div>
                        </div>
                    </div>

                    <!-- Input Penawaran -->
                    <div class="space-y-2">
                        <label class="block text-sm font-semibold text-gray-700">2. Penawaran (Quotation/Invoice)</label>
                        <div class="relative border-2 border-dashed border-gray-300 rounded-lg p-4 hover:border-blue-500 transition-all text-center">
                            <input id="file_penawaran" type="file" accept=".pdf" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer" required>
                            <div class="text-gray-500">
                                <svg class="mx-auto h-8 w-8 mb-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"/></svg>
                                <span class="text-xs" id="name_penawaran">Pilih file PDF</span>
                            </div>
                        </div>
                    </div>

                    <!-- URL Webhook -->
                    <div class="md:col-span-2 space-y-2">
                        <label class="block text-sm font-semibold text-gray-700">Webhook n8n Endpoint</label>
                        <input type="url" id="webhook_url" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none" value="https://n8.waruna-group.co.id/webhook/audit-dokumen" required>
                    </div>

                    <button type="submit" id="submitBtn" class="md:col-span-2 bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-lg shadow-lg transition-all transform hover:-translate-y-1">
                        Jalankan Audit
                    </button>
                </form>

                <!-- Hasil Audit -->
                <div id="resultContainer" class="mt-12 hidden">
                    <h2 class="text-xl font-bold text-gray-800 mb-4 border-b pb-2">Hasil Temuan Audit:</h2>
                    <div id="outputResult"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Update label nama file
        document.getElementById('file_sertifikat').addEventListener('change', e => {
            document.getElementById('name_sertifikat').textContent = e.target.files[0].name;
        });
        document.getElementById('file_penawaran').addEventListener('change', e => {
            document.getElementById('name_penawaran').textContent = e.target.files[0].name;
        });

        document.getElementById('auditForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            const resultContainer = document.getElementById('resultContainer');
            const outputResult = document.getElementById('outputResult');
            const webhookUrl = document.getElementById('webhook_url').value;

            const formData = new FormData();
            formData.append('sertifikat', document.getElementById('file_sertifikat').files[0]);
            formData.append('penawaran', document.getElementById('file_penawaran').files[0]);

            btn.disabled = true;
            btn.innerHTML = `<span class="flex items-center justify-center"><svg class="animate-spin h-5 w-5 mr-3 border-t-2 border-white rounded-full" viewBox="0 0 24 24"></svg> Memproses Audit...</span>`;
            resultContainer.classList.add('hidden');

            try {
                const response = await fetch(webhookUrl, { method: 'POST', body: formData });
                if (!response.ok) throw new Error('Gagal menghubungi n8n');
                
                const data = await response.json();
                
                // Menentukan class berdasarkan status
                const statusClass = data.status === 'MATCH' ? 'status-match' : 'status-discrepancy';
                
                let htmlContent = `
                    <div class="mb-8 p-6 rounded-xl ${statusClass}">
                        <div class="flex items-center justify-between">
                            <h3 class="text-lg font-bold">RINGKASAN STATUS: ${data.status}</h3>
                            <span class="px-3 py-1 rounded-full bg-white bg-opacity-50 text-xs font-bold uppercase tracking-wider">Audit AP</span>
                        </div>
                        <p class="mt-2 text-sm opacity-90 italic">"${data.rekomendasi_tindakan}"</p>
                    </div>

                    <div class="bg-white border rounded-xl overflow-hidden shadow-sm">
                        <table class="min-w-full divide-y divide-gray-200">
                            <thead>
                                <tr class="bg-gray-50">
                                    <th class="px-6 py-4 text-left text-xs font-bold text-gray-500 uppercase">Item Temuan</th>
                                    <th class="px-6 py-4 text-left text-xs font-bold text-gray-500 uppercase">Data Penawaran</th>
                                    <th class="px-6 py-4 text-left text-xs font-bold text-gray-500 uppercase">Data Sertifikat</th>
                                    <th class="px-6 py-4 text-left text-xs font-bold text-gray-500 uppercase text-red-600">Analisis Auditor</th>
                                </tr>
                            </thead>
                            <tbody class="divide-y divide-gray-200">
                                ${data.temuan.map(t => `
                                    <tr class="hover:bg-blue-50 transition-colors">
                                        <td class="px-6 py-4 text-sm font-bold text-gray-900 bg-gray-50/50">${t.item}</td>
                                        <td class="px-6 py-4 text-sm text-gray-600">${t.di_penawaran}</td>
                                        <td class="px-6 py-4 text-sm text-gray-600">${t.di_sertifikat}</td>
                                        <td class="px-6 py-4 text-sm font-medium text-red-700 bg-red-50/30">${t.analisis}</td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    </div>
                    <div class="mt-4 text-right">
                        <button onclick="window.print()" class="text-xs text-blue-600 hover:underline font-medium">Cetak Laporan Audit</button>
                    </div>
                `;

                outputResult.innerHTML = htmlContent;
                resultContainer.classList.remove('hidden');
                
            } catch (error) {
                outputResult.innerHTML = `<div class="p-4 bg-red-50 text-red-700 rounded-lg border border-red-200">
                    <strong>Error:</strong> ${error.message}. Pastikan n8n Aktif dan CORS sudah diizinkan.
                </div>`;
                resultContainer.classList.remove('hidden');
            } finally {
                btn.disabled = false;
                btn.textContent = 'Jalankan Audit';
            }
        });
    </script>
</body>
</html>
