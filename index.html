<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Waruna Group | Verifikasi Dokumen Keselamatan V7</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #1e3a8a;
            --primary-light: #eff6ff; 
            --border-color: #e0e0e0;
            --text-main: #333;
            --text-muted: #666;
            --success: #2e7d32;
            --error: #c62828;
            --radius-md: 0.5rem;
            --radius-lg: 0.75rem;
        }
        body { font-family: 'Inter', sans-serif; font-size: 13px; color: var(--text-main); background: #f4f6f8; margin: 0; padding: 20px; line-height: 1.5; }
        .app-header { display:flex; justify-content:space-between; align-items:center; background:#fff; padding:1rem 1.5rem; border-radius:12px; border:1px solid var(--border-color); margin-bottom: 20px; max-width: 1400px; margin-left: auto; margin-right: auto; }
        .brand-name { font-weight:700; font-size:1.1rem; color:var(--primary); }
        .upload-card { background:#fff; border-radius:12px; padding:2rem; border:1px solid var(--border-color); max-width:1400px; margin: 0 auto 24px auto; }
        .upload-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:1.5rem; margin-bottom:1.5rem; }
        .upload-zone { border:2px dashed #cbd5e1; border-radius:12px; padding:1.5rem; text-align:center; background:#f8fafc; }
        .upload-zone.has-file { border-color:var(--success); background:#f0fdf4; border-style:solid; }
        .uz-label { display:block; font-weight:700; color:var(--primary); font-size:12px; text-transform:uppercase; margin-bottom:10px; }
        .file-input { display:block; width:100%; font-size:12px; color:var(--text-muted); cursor:pointer; }
        .file-input::file-selector-button { display:block; width:100%; text-align:center; margin-bottom:.5rem; padding:.4rem 1rem; border-radius:var(--radius-md); border:none; font-weight:700; font-size:.75rem; background:var(--primary-light); color:var(--primary); cursor:pointer; }
        .file-badge { display:none; margin-top:10px; font-size:12px; background:#fff; border:1px solid var(--success); border-radius:4px; padding:6px; word-break:break-all; }
        .file-badge.show { display:block; }
        .btn-run { width:100%; background:var(--primary); color:#fff; font-weight:700; font-size:14px; padding:12px; border-radius:8px; border:none; cursor:pointer; text-transform:uppercase; transition: background 0.2s; }
        .btn-run:disabled { opacity:0.5; cursor:not-allowed; }
        .loading-box { display:none; text-align:center; padding:2rem; background:#fff; border-radius:12px; border:1px solid var(--border-color); max-width:1400px; margin: 0 auto; }
        .loading-box.show { display:block; }
        .error-box { display:none; background:#ffebee; border-left:4px solid var(--error); padding:1rem; color:var(--error); font-weight:600; border-radius:8px; margin-bottom:20px; max-width:1400px; margin: 0 auto 20px auto;}
        .error-box.show { display:block; }
        .spinner { width:48px; height:48px; margin:0 auto 1.25rem; border:3px solid var(--primary-light); border-top-color:var(--primary); border-radius:50%; animation:spin .9s linear infinite; }
        @keyframes spin { to { transform:rotate(360deg); } }

        /* TABEL LAPORAN AUDIT */
        .card-container { background: #fff; padding: 24px; border-radius: 12px; border: 1px solid var(--border-color); box-shadow: 0 4px 6px rgba(0,0,0,0.02); margin-bottom: 24px; max-width: 1400px; margin-left: auto; margin-right: auto; }
        table { border-collapse: separate; border-spacing: 0; width: 100%; margin-bottom: 32px; background: #fff; border-radius: 8px; border: 1px solid var(--border-color); overflow: hidden; }
        th { background-color: var(--primary-light); color: var(--primary); padding: 12px 10px; text-align: left; font-size: 12px; font-weight: 700; border-bottom: 2px solid var(--primary); border-right: 1px solid var(--border-color); text-transform: uppercase; letter-spacing: 0.3px; }
        td { border-bottom: 1px solid var(--border-color); border-right: 1px solid var(--border-color); padding: 10px 10px; vertical-align: top; }
        th:last-child, td:last-child { border-right: none; }
        tr:last-child td { border-bottom: none; }
        .item-row td { border-bottom: none !important; } 
        .explanation-row td { padding-top: 4px; padding-bottom: 16px; border-top: none; }
        .ok-cell { background-color: #fcfdfc; text-align: center; vertical-align:middle; border-left:4px solid var(--success);}
        .err-cell { background-color: #fffafb; text-align: center; vertical-align:middle; border-left:4px solid var(--error);}
        .section-title td { background-color: var(--primary); color: white; font-weight: 600; border-bottom: none; padding: 10px 14px; text-transform: uppercase; letter-spacing: 0.5px; font-size: 13px; }
        .header-info { display: flex; justify-content: space-between; align-items: flex-start; padding-bottom: 20px; margin-bottom: 24px; border-bottom: 2px solid var(--primary-light); }
        .header-info-left h2 { margin: 0 0 8px 0; color: var(--primary); font-size: 22px; text-transform: uppercase;}
        .header-info-left p { margin: 4px 0; font-size: 14px; color: var(--text-muted);}
        .header-info-right { text-align: right; font-size: 12px; color: var(--text-muted); background: var(--primary-light); padding: 12px 16px; border-radius: 8px; border: 1px solid #dbeafe;}
        .header-info-right strong { color: var(--primary); }
        .ai-box { background:#fff; border:1px solid #ebebeb; padding:10px 14px; border-radius:6px; box-shadow:0 1px 2px rgba(0,0,0,0.03); }
        .doc-val { font-size: 12px; color: #444; background: #f8fafc; padding: 6px 8px; border-radius: 4px; border: 1px solid #e2e8f0; min-height: 20px;}
        .doc-val-err { font-weight: 600; color: var(--error); background: #fef2f2; border-color: #fecaca; }
        @media (max-width:768px) { .upload-grid { grid-template-columns:1fr; } }
    </style>
</head>
<body>

<header class="app-header">
    <div class="brand-name">WARUNA GROUP | Audit Dokumen AI V7</div>
</header>

<div class="upload-card">
    <div class="upload-grid">
        <div class="upload-zone" id="zone-p">
            <span class="uz-label">📄 Quotation / Penawaran</span>
            <input type="file" id="file-penawaran" class="file-input" accept="application/pdf">
            <div class="file-badge" id="fbadge-p"><strong id="fname-p">—</strong></div>
        </div>
        <div class="upload-zone" id="zone-s">
            <span class="uz-label">📄 Laporan Sertifikat</span>
            <input type="file" id="file-sertifikat" class="file-input" accept="application/pdf">
            <div class="file-badge" id="fbadge-s"><strong id="fname-s">—</strong></div>
        </div>
        <div class="upload-zone" id="zone-d">
            <span class="uz-label">📄 Surat Jalan / DO (Opsional)</span>
            <input type="file" id="file-do" class="file-input" accept="application/pdf">
            <div class="file-badge" id="fbadge-d"><strong id="fname-d">—</strong></div>
        </div>
    </div>
    <button type="button" id="btn-run" class="btn-run">Mulai Analisis Dokumen</button>
</div>

<div class="loading-box" id="loading">
    <div class="spinner"></div>
    <h3 style="margin-top:20px; color:#1e3a8a;">Proses Audit AI Sedang Berjalan...</h3>
    <div id="loading-txt" style="margin-top: 15px;"></div>
</div>
<div class="error-box" id="err-box"></div>

<div id="result"></div>

<script>
function bindFile(inId,zoneId,nameId,badgeId){
    var inp=document.getElementById(inId); if(!inp) return;
    inp.addEventListener("change",function(){
        if(this.files.length){
            document.getElementById(nameId).textContent=this.files[0].name;
            document.getElementById(badgeId).classList.add("show");
            document.getElementById(zoneId).classList.add("has-file");
        }
    });
}
bindFile("file-penawaran","zone-p","fname-p","fbadge-p");
bindFile("file-sertifikat","zone-s","fname-s","fbadge-s");
bindFile("file-do","zone-d","fname-d","fbadge-d");

var pollInt = null;
var timerInt = null;
var WH_SUBMIT = "https://n8.waruna-group.co.id/webhook/audit-dokumen";
var WH_POLL   = "https://n8.waruna-group.co.id/webhook/check-status-audit";

function lockUI(){
    document.getElementById("btn-run").disabled = true;
    document.getElementById("result").innerHTML = "";
    document.getElementById("err-box").classList.remove("show");
    document.getElementById("loading").classList.add("show");
    
    var txtEl = document.getElementById("loading-txt");
    var startMs = Date.now();
    
    clearInterval(timerInt);
    timerInt = setInterval(function() {
        var diff = Math.floor((Date.now() - startMs) / 1000);
        var m = Math.floor(diff / 60).toString().padStart(2, "0");
        var s = (diff % 60).toString().padStart(2, "0");
        var animArray = ["0---", "-0--", "--0-", "---0"];
        var anim = animArray[diff % 4]; 
        
        txtEl.innerHTML = 
            "<span style='font-size:24px; font-weight:700; color:var(--primary);'>" + m + ":" + s + "</span>" +
            "<span style='font-family:monospace; color:#888; font-size:16px; font-weight:bold;'>[" + anim + "] Mengekstrak & Menilai Data [" + anim + "]</span>" +
            "<div style='background:#fef2f2; border:1px solid #fecaca; color:#c62828; padding:10px; border-radius:6px; max-width:400px; margin:0 auto; font-size:12px; font-weight:500;'>" +
            "Proses Estafet AI Berjalan. Jangan tutup halaman ini.</div>";
    }, 1000);
}

function unlockUI(){
    clearInterval(timerInt);
    document.getElementById("btn-run").disabled = false;
    document.getElementById("loading").classList.remove("show");
}

function showErr(msg){ 
    clearInterval(pollInt); 
    unlockUI(); 
    var e = document.getElementById("err-box"); 
    e.innerHTML = "<strong>Kesalahan:</strong> " + msg; 
    e.classList.add("show"); 
}

function esc(s){ return String(s||"-").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

document.getElementById("btn-run").addEventListener("click", async function(){
    var pI=document.getElementById("file-penawaran"), sI=document.getElementById("file-sertifikat"), dI=document.getElementById("file-do");
    
    // Validasi DO DiHapus (Dibuat Opsional)
    if(!pI.files.length || !sI.files.length) return showErr("Dokumen Penawaran dan Sertifikat wajib diunggah.");
    
    var jobId = "JOB-" + Date.now();
    var fd = new FormData();
    fd.append("penawaran", pI.files[0]); 
    fd.append("sertifikat", sI.files[0]); 
    if(dI.files.length > 0) fd.append("surat_jalan", dI.files[0]); // Lampirkan jika ada
    fd.append("job_id", jobId);
    
    lockUI();
    
    try {
        var res = await fetch(WH_SUBMIT, {method:"POST", body:fd});
        if(!res.ok) throw new Error("Server error HTTP " + res.status);
        pollInt = setInterval(function(){ poll(jobId); }, 10000);
    } catch(e){ showErr(e.message); }
});

async function poll(jobId){
    try {
        var res=await fetch(WH_POLL+"?job_id="+jobId);
        if(!res.ok) return;
        var txt=await res.text();
        if(!txt || txt.trim().charAt(0)==="<") return;
        var data=JSON.parse(txt);
        if(data.status==="processing") return;
        
        var rows = Array.isArray(data) ? data : (data.data || [data]);
        var ourRow = rows.find(r => r["Job ID"] === jobId || r["job_id"] === jobId);
        if(!ourRow) return;
        
        clearInterval(pollInt); 
        unlockUI();
        
        var fullPayloadStr = "";
        if (ourRow["Payload"]) {
             fullPayloadStr = ourRow["Payload"];
        } else {
             for(let i=1; i<=10; i++) {
                 fullPayloadStr += (ourRow["Payload" + i] || "");
             }
        }
        
        var parsed={};
        try{ parsed=JSON.parse(fullPayloadStr); }catch(e){ return showErr("Gagal membaca hasil JSON dari AI. Format tidak valid."); }
        
        renderAuditReport(parsed, jobId);
    } catch(e){}
}

function renderAuditReport(parsed, jobId){
    var c = document.getElementById("result");
    var isOk = parsed.status_keseluruhan === "ALL_MATCH";
    var statusText = isOk ? "✅ SEMUA DOKUMEN SINKRON" : "⚠️ DITEMUKAN ANOMALI DATA";
    var statusColor = isOk ? "var(--success)" : "var(--error)";

    let namaKapal = "TIDAK TERDETEKSI";
    if(parsed.tabel_audit) {
        let n = parsed.tabel_audit.find(r => r.keterangan && r.keterangan.toLowerCase().includes("kapal"));
        if(n) namaKapal = n.di_penawaran || n.di_sertifikat || n.di_do;
    }

    var html = `
    <div class="card-container">
        <div class="header-info">
            <div class="header-info-left">
                <h2>Laporan Verifikasi Keselamatan</h2>
                <p><b style="color:var(--text-main)">Vessel / Kapal:</b> ${esc(namaKapal)}</p>
                <p><b style="color:var(--text-main)">Status Akhir:</b> <span style="color:${statusColor}; font-weight:800; font-size:15px;">${statusText}</span></p>
            </div>
            <div class="header-info-right">
                <div style="margin-bottom:6px;"><strong>Job ID Referensi:</strong>${jobId}</div>
                <div><strong>Waktu Selesai Audit:</strong>${new Date().toLocaleString('id-ID')}</div>
            </div>
        </div>
    `;

    if (parsed.tabel_audit && parsed.tabel_audit.length > 0) {
        var groups = {};
        parsed.tabel_audit.forEach(row => {
            var k = row.kategori || "Pemeriksaan Lainnya";
            if (!groups[k]) groups[k] = [];
            groups[k].push(row);
        });

        let tableCounter = 1;
        for (var kat in groups) {
            html += `<table>`;
            html += `<tr class="section-title"><td colspan="6">TABEL ${tableCounter}: ${esc(kat)}</td></tr>`;
            html += `<tr>
                <th width="5%" class="center">NO</th>
                <th width="20%">POIN PEMERIKSAAN</th>
                <th width="20%">DI PENAWARAN</th>
                <th width="20%">DI SERTIFIKAT</th>
                <th width="20%">DI DELIVERY ORDER</th>
                <th width="15%" class="center">STATUS</th>
            </tr>`;

            groups[kat].forEach((row, idx) => {
                var hasilAiStr = String(row.hasil_ai || "");
                // Logika Pendeteksi ANOMALI baru
                var isWarn = hasilAiStr.includes('⚠') || hasilAiStr.toLowerCase().includes('anomali');
                
                var statusIcon = isWarn ? '&#10008; ANOMALI' : '&#10004; MATCH';
                var statusClass = isWarn ? 'err-cell' : 'ok-cell';
                var textClass = isWarn ? 'color:#c62828;' : 'color:#2e7d32;';
                var valClass = isWarn ? 'doc-val doc-val-err' : 'doc-val';

                html += `<tr class="item-row">
                    <td align="center" style="font-weight:bold; font-size:14px; color:var(--primary);">${idx + 1}</td>
                    <td style="background-color:#f8fafc; font-weight:700; color:#333;">${esc(row.keterangan)}</td>
                    <td><div class="${valClass}">${esc(row.di_penawaran)}</div></td>
                    <td><div class="${valClass}">${esc(row.di_sertifikat)}</div></td>
                    <td><div class="${valClass}">${esc(row.di_do)}</div></td>
                    <td class="${statusClass}"><span style="${textClass} font-weight:900; font-size:13px; letter-spacing: 0.5px;">${statusIcon}</span></td>
                </tr>`;

                var cleanReason = hasilAiStr.replace(/✅ MATCH|⚠️ ANOMALI|✅ SESUAI|⚠️ BEDA \/ TIDAK ADA/gi, '').trim();
                // Jika alasan bersih kosong/hanya titik
                if(!cleanReason || cleanReason === '-' || cleanReason === '.' || cleanReason === '') {
                     cleanReason = isWarn ? "Ditemukan ketidaksinkronan data atau data hilang antar dokumen." : "Semua data tervalidasi sinkron 100%.";
                }
                if (cleanReason.startsWith('.')) cleanReason = cleanReason.substring(1).trim();

                var expBoxClass = isWarn ? 'border-left:4px solid #c62828;' : 'border-left:4px solid #2e7d32;';
                var expTitleColor = isWarn ? '#c62828' : '#2e7d32';
                var expIcon = isWarn ? '&#9888; Analisis AI (Ketidaksesuaian):' : '&#129302; Analisis AI (Valid):';

                html += `<tr class="explanation-row">
                    <td style="border-right:1px solid var(--border-color);"></td>
                    <td colspan="5" style="background:#f8fafc;">
                        <div class="ai-box" style="${expBoxClass}">
                            <div style="color:${expTitleColor}; font-size:12px; margin-bottom:4px;"><b>${expIcon}</b></div>
                            <div style="color:#444; font-size:12px; font-weight: 500;">${esc(cleanReason)}</div>
                        </div>
                    </td>
                </tr>`;
            });
            html += `</table>`;
            tableCounter++;
        }
    } else {
        html += `<p style="text-align:center; padding: 20px; color:#666;">Data hasil ekstraksi kosong. AI tidak menemukan data yang relevan.</p>`;
    }

    html += `</div>`; 
    c.innerHTML = html;
}
</script>
</body>
</html>
