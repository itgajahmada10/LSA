<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Waruna Group | Audit LSA V8 Full Logic</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Inter', sans-serif; font-size: 11px; background: #f1f5f9; padding: 20px; }
        .cert-block { background: #fff; border: 1px solid #e2e8f0; border-radius: 8px; margin-bottom: 30px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
        .cert-header { background: #1e3a8a; color: #fff; padding: 12px 15px; font-weight: 800; text-transform: uppercase; display: flex; justify-content: space-between; }
        table { width: 100%; border-collapse: collapse; }
        th { background: #f8fafc; padding: 10px; font-size: 10px; border-bottom: 2px solid #e2e8f0; text-transform: uppercase; text-align: left; }
        td { border-bottom: 1px solid #e2e8f0; padding: 10px; vertical-align: top; }
        .tag-rn { background: #fef9c3; border: 1px solid #facc15; padding: 2px 6px; border-radius: 4px; font-weight: 800; color: #854d0e; font-size: 9px; }
        .badge-fail { background: #fee2e2; color: #b91c1c; padding: 3px 6px; border-radius: 4px; font-weight: 800; font-size: 9px; text-transform: uppercase; }
        .badge-pass { background: #dcfce7; color: #15803d; padding: 3px 6px; border-radius: 4px; font-weight: 800; font-size: 9px; text-transform: uppercase; }
    </style>
</head>
<body>

<div id="container" class="max-w-5xl mx-auto">
    <div id="status-display" class="p-4 bg-blue-100 text-blue-800 rounded">Menunggu data...</div>
</div>

<script>
// LOGIKA AUDIT SOP LSA V8 (DIRETAIN FULL)
function renderCertificateReport(parsed) {
    const container = document.getElementById("container");
    const certGroups = {};

    // 1. Grouping Sertifikat
    parsed.tabel_audit.forEach(row => {
        let certNo = (row.certificate_no || "0908/CMSI/LSA/03/2026").trim();
        if (!certGroups[certNo]) certGroups[certNo] = [];
        certGroups[certNo].push(row);
    });

    let html = "";
    Object.keys(certGroups).forEach(cNo => {
        // FILTER: Tetap tampilkan item RN dan komponen fisik kritis yang disepakati
        const rows = certGroups[cNo].filter(r => {
            const raw = String(r.di_sertifikat || "").toLowerCase();
            return raw.includes('rn') || 
                   r.keterangan.toLowerCase().includes('strapping') || 
                   r.keterangan.toLowerCase().includes('labels') ||
                   r.keterangan.toLowerCase().includes('marking');
        });

        if (rows.length === 0) return; // Skip sertifikat jika tidak ada item RN

        html += `<div class="cert-block"><div class="cert-header">📋 NOMOR SERTIFIKAT: ${cNo}</div><table><thead><tr><th>NO</th><th>ITEM</th><th>STATUS</th><th>AUDIT ANALISIS (SOP LSA V8)</th></tr></thead><tbody>`;
        
        rows.forEach((r, i) => {
            const isAnomali = String(r.hasil_ai).includes('⚠️') || String(r.hasil_ai).toLowerCase().includes('non-compliant');
            html += `
            <tr>
                <td>${i + 1}</td>
                <td><div class="font-bold">${r.keterangan}</div></td>
                <td><span class="tag-rn">STATUS: RENEWAL (RN)</span></td>
                <td>
                    <div class="text-[10px] text-gray-700">${r.hasil_ai}</div>
                    <span class="status-badge ${isAnomali ? 'badge-fail' : 'badge-pass'}">
                        ${isAnomali ? '⚠️ NON-COMPLIANT' : '✓ SOP COMPLIANT'}
                    </span>
                </td>
            </tr>`;
        });
        html += `</tbody></table></div>`;
    });
    container.innerHTML = html;
}

// STITCHER PAYLOAD (Menggabungkan 10 kolom Sheets)
async function init() {
    try {
        const res = await fetch("https://n8.waruna-group.co.id/webhook/check-status-audit?job_id=JOB_LIFERAFT_V8");
        const rows = await res.json();
        const row = rows[rows.length - 1];
        let fullPayloadStr = "";
        for(let i = 1; i <= 10; i++) if (row["Payload" + i]) fullPayloadStr += row["Payload" + i];
        if (fullPayloadStr) renderCertificateReport(JSON.parse(fullPayloadStr));
    } catch(err) { console.error(err); }
}
window.onload = init;
</script>
</body>
</html>
