<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Audit LSA & APAR - Waruna Group</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #fffbeb; }
        .header-gradient { background: linear-gradient(90deg, #fef3c7 0%, #fde68a 100%); }
        .btn-waruna { background-color: #4c1d95; transition: all 0.3s ease; }
        .btn-waruna:hover { background-color: #5b21b6; transform: translateY(-1px); }
        .card-container { border-top: 4px solid #f59e0b; }
        .status-match { background-color: #dcfce7; color: #166534; border: 1px solid #bbf7d0; }
        .status-discrepancy { background-color: #fee2e2; color: #991b1b; border: 1px solid #fecaca; }
        .item-card { border-left: 4px solid #4c1d95; }
    </style>
</head>
<body class="min-h-screen font-sans text-slate-800">
    <div class="max-w-5xl mx-auto py-10 px-4">
        <div class="bg-white shadow-xl rounded-xl overflow-hidden card-container">
            <!-- Header BeeSuite Style -->
            <div class="header-gradient px-8 py-6 border-b border-amber-200">
                <h1 class="text-2xl font-bold text-amber-900">Sistem Audit Dokumen Kapal</h1>
                <p class="text-amber-700 text-sm mt-1 font-medium">Rekonsiliasi Sertifikat Inspeksi vs Penawaran Vendor</p>
            </div>

            <div class="p-8">
                <form id="auditForm" class="space-y-6">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <!-- Input Sertifikat -->
                        <div class="space-y-2">
                            <label class="block text-sm font-bold text-slate-700">1. Sertifikat (Laporan Servis)</label>
                            <div class="relative border-2 border-dashed border-amber-200 rounded-lg p-6 hover:bg-amber-50 transition-all text-center group">
                                <input id="file_sertifikat" type="file" accept=".pdf" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer" required>
                                <div class="text-amber-600">
                                    <svg class="mx-auto h-10 w-10 mb-2 opacity-70 group-hover:scale-110" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"/></svg>
                                    <span class="text-sm font-medium" id="name_sertifikat">Pilih PDF Sertifikat</span>
                                </div>
                            </div>
                        </div>

                        <!-- Input Penawaran -->
                        <div class="space-y-2">
                            <label class="block text-sm font-bold text-slate-700">2. Penawaran (Quotation/Invoice)</label>
                            <div class="relative border-2 border-dashed border-amber-200 rounded-lg p-6 hover:bg-amber-50 transition-all text-center group">
                                <input id="file_penawaran" type="file" accept=".pdf" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer" required>
                                <div class="text-amber-600">
                                    <svg class="mx-auto h-10 w-10 mb-2 opacity-70 group-hover:scale-110" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"/></svg>
                                    <span class="text-sm font-medium" id="name_penawaran">Pilih PDF Penawaran</span>
                                </div>
                            </div>
                        </div>
                    </div>

                    <button type="submit" id="submitBtn" class="w-full btn-waruna text-white font-bold py-4 rounded-lg shadow-md uppercase tracking-wider text-sm">
                        Mulai Audit Dokumen
                    </button>
                </form>

                <!-- Hasil Audit -->
                <div id="resultContainer" class="mt-12 hidden">
                    <h2 class="text-xl font-bold text-purple-900 mb-6 flex items-center">
                        <span class="w-2 h-8 btn-waruna mr-3 rounded-full"></span>
                        Hasil Temuan Audit
                    </h2>
                    <div id="outputResult"></div>
                </div>
            </div>
        </div>
        <p class="text-center text-slate-400 text-xs mt-6">Waruna Group Vessel Audit System v1.1.0</p>
    </div>

    <script>
        const WEBHOOK_URL = 'https://n8.waruna-group.co.id/webhook/audit-dokumen';

        document.getElementById('file_sertifikat').addEventListener('change', e => {
            document.getElementById('name_sertifikat').textContent = e.target.files[0].name;
        });
        document.getElementById('file_penawaran').addEventListener('change', e => {
            document.getElementById('name_penawaran').textContent = e.target.files[0].name;
        });

        document.getElementById('auditForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            const resultContainer = document.getElementById('resultContainer');
            const outputResult = document.getElementById('outputResult');

            const formData = new FormData();
            formData.append('sertifikat', document.getElementById('file_sertifikat').files[0]);
            formData.append('penawaran', document.getElementById('file_penawaran').files[0]);

            btn.disabled = true;
            btn.innerHTML = `Memproses...`;
            resultContainer.classList.add('hidden');

            try {
                const response = await fetch(WEBHOOK_URL, { method: 'POST', body: formData });
                const data = await response.json();
                
                const statusClass = data.status === 'MATCH' ? 'status-match' : 'status-discrepancy';
                
                let htmlContent = `
                    <!-- Ringkasan Status -->
                    <div class="mb-8 p-6 rounded-xl ${statusClass} shadow-sm">
                        <h3 class="text-lg font-bold uppercase tracking-tight">STATUS AKHIR: ${data.status}</h3>
                        <p class="mt-2 text-sm font-medium opacity-90">${data.rekomendasi_tindakan}</p>
                    </div>

                    <!-- Poin-Poin Temuan -->
                    <div class="space-y-4">
                        ${data.temuan.map(t => `
                            <div class="bg-white p-6 rounded-xl border border-amber-100 shadow-sm item-card">
                                <div class="flex justify-between items-start mb-4">
                                    <h4 class="font-bold text-purple-900 text-lg">${t.item}</h4>
                                    <span class="text-[10px] bg-amber-100 px-2 py-1 rounded font-bold text-amber-700">REF: ${t.referensi_dokumen || 'N/A'}</span>
                                </div>
                                <div class="grid grid-cols-1 md:grid-cols-2 gap-4 text-sm mb-4">
                                    <div class="p-3 bg-slate-50 rounded border border-slate-100">
                                        <span class="block text-[10px] font-bold text-slate-400 uppercase mb-1 text-purple-700">Data Penawaran</span>
                                        <p class="text-slate-700">${t.di_penawaran}</p>
                                    </div>
                                    <div class="p-3 bg-slate-50 rounded border border-slate-100">
                                        <span class="block text-[10px] font-bold text-slate-400 uppercase mb-1 text-purple-700">Data Sertifikat</span>
                                        <p class="text-slate-700">${t.di_sertifikat}</p>
                                    </div>
                                </div>
                                <div class="p-4 bg-red-50 rounded-lg border border-red-100">
                                    <p class="text-sm font-semibold text-red-800 italic leading-relaxed">
                                        <span class="mr-2">🔍</span>Analisis Auditor: ${t.analisis}
                                    </p>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                `;

                outputResult.innerHTML = htmlContent;
                resultContainer.classList.remove('hidden');
                
            } catch (error) {
                outputResult.innerHTML = `<div class="p-4 bg-red-50 text-red-800 rounded-lg">Error: ${error.message}</div>`;
                resultContainer.classList.remove('hidden');
            } finally {
                btn.disabled = false;
                btn.textContent = 'Mulai Audit Dokumen';
            }
        });
    </script>
</body>
</html>
