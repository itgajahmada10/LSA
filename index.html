<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Waruna Group | Multi-Certificate Audit V8</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Inter', sans-serif; font-size: 11px; background: #f1f5f9; padding: 20px; }
        .cert-block { background: #fff; border: 1px solid #e2e8f0; border-radius: 8px; margin-bottom: 30px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); overflow: hidden; }
        .cert-header { background: #1e3a8a; color: #fff; padding: 12px 15px; font-weight: 800; text-transform: uppercase; display: flex; justify-content: space-between; }
        table { width: 100%; border-collapse: collapse; }
        th { background: #f8fafc; padding: 10px; font-size: 10px; border-bottom: 2px solid #e2e8f0; text-transform: uppercase; text-align: left; }
        td { border-bottom: 1px solid #e2e8f0; padding: 10px; vertical-align: top; }
        .tag-rn { background: #fef9c3; border: 1px solid #facc15; padding: 2px 6px; border-radius: 4px; font-weight: 800; color: #854d0e; font-size: 9px; }
        .tag-ok { background: #dcfce7; border: 1px solid #bbf7d0; padding: 2px 6px; border-radius: 4px; font-weight: 800; color: #166534; font-size: 9px; }
    </style>
</head>
<body>

<div id="container" class="max-w-5xl mx-auto">
    </div>

<script>
// FUNGSI UTAMA: Mengolah data dari Sheets/n8n
function renderCertificateReport(data) {
    const container = document.getElementById("container");
    if (!data || !data.tabel_audit) {
        container.innerHTML = "<div class='p-10 text-center font-bold text-red-600'>Data tidak ditemukan/kosong.</div>";
        return;
    }

    const certGroups = {};
    // Grouping Dinamis berdasarkan nomor sertifikat
    data.tabel_audit.forEach(row => {
        let certNo = (row.certificate_no || "UNKNOWN-CERT").trim();
        if (!certGroups[certNo]) certGroups[certNo] = [];
        certGroups[certNo].push(row);
    });

    let html = "";
    Object.keys(certGroups).forEach(cNo => {
        html += `
        <div class="cert-block">
            <div class="cert-header">
                <span>📋 NOMOR SERTIFIKAT: ${cNo}</span>
                <span>TOTAL ITEM: ${certGroups[cNo].length}</span>
            </div>
            <table>
                <thead>
                    <tr><th>NO</th><th>ITEM INSPEKSI</th><th>QTY / EXPIRY</th><th>AUDIT AI</th></tr>
                </thead>
                <tbody>
                    ${certGroups[cNo].map((r, i) => {
                        // Proteksi Split String agar tidak crash
                        const splitData = r.di_sertifikat ? r.di_sertifikat.split('|') : ["-", "-"];
                        const qty = splitData[0] || "-";
                        const exp = splitData[1] || "-";
                        const isRN = r.di_sertifikat.toLowerCase().includes('rn') || r.di_sertifikat.toLowerCase().includes('renew');
                        
                        return `
                        <tr>
                            <td>${i + 1}</td>
                            <td>
                                <div class="font-bold">${r.keterangan}</div>
                                ${isRN ? '<span class="tag-rn">STATUS: RENEWAL (RN)</span>' : '<span class="tag-ok">STATUS: REGULER (OK)</span>'}
                            </td>
                            <td>${qty}<br><small class="text-gray-500">${exp}</small></td>
                            <td class="text-[10px] text-gray-700 leading-relaxed">${r.hasil_ai}</td>
                        </tr>`;
                    }).join('')}
                </tbody>
            </table>
        </div>`;
    });
    container.innerHTML = html;
}

// FUNGSI STITCHER: Menggabungkan potongan Payload 1-10 dari database
function processData(rawRows) {
    let fullPayloadStr = "";
    // Loop kolom Payload 1 sampai 10
    for(let i = 1; i <= 10; i++) {
        if (rawRows["Payload" + i]) fullPayloadStr += rawRows["Payload" + i];
    }
    
    if (fullPayloadStr) {
        try {
            renderCertificateReport(JSON.parse(fullPayloadStr));
        } catch(e) {
            console.error("Gagal Parsing JSON:", e);
        }
    }
}

// CONTOH PEMANGGILAN (Ganti dengan cara Anda mengambil data dari Sheets/Webhook)
// processData(dataDariSheets[0]); 
</script>
</body>
</html>
