<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Waruna Group | Audit LSA V8</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: sans-serif; background: #f1f5f9; padding: 20px; }
        .cert-block { background: #fff; border: 1px solid #e2e8f0; border-radius: 8px; margin-bottom: 30px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
        .cert-header { background: #1e3a8a; color: #fff; padding: 12px; font-weight: bold; }
    </style>
</head>
<body>

<div id="container" class="max-w-5xl mx-auto">
    <div id="status-display" class="p-4 bg-yellow-100 text-yellow-800 rounded">Sedang memuat data...</div>
</div>

<script>
function renderCertificateReport(data) {
    const container = document.getElementById("container");
    const statusEl = document.getElementById("status-display");

    // 1. Validasi Keberadaan Data
    if (!data || !data.tabel_audit || !Array.isArray(data.tabel_audit)) {
        statusEl.innerHTML = "❌ Data tidak valid diterima: " + JSON.stringify(data);
        return;
    }

    statusEl.style.display = "none";
    const certGroups = {};

    // 2. Grouping
    data.tabel_audit.forEach(row => {
        let certNo = (row.certificate_no || "UNKNOWN-CERT").trim();
        if (!certGroups[certNo]) certGroups[certNo] = [];
        certGroups[certNo].push(row);
    });

    // 3. Render
    let html = "";
    Object.keys(certGroups).forEach(cNo => {
        html += `
        <div class="cert-block">
            <div class="cert-header">📋 NOMOR SERTIFIKAT: ${cNo}</div>
            <table class="w-full text-left">
                <thead class="bg-gray-50 text-xs uppercase text-gray-500">
                    <tr><th class="p-3">NO</th><th class="p-3">ITEM</th><th class="p-3">QTY/EXP</th><th class="p-3">AUDIT</th></tr>
                </thead>
                <tbody>
                    ${certGroups[cNo].map((r, i) => `
                        <tr class="border-t border-gray-100">
                            <td class="p-3">${i + 1}</td>
                            <td class="p-3 font-semibold">${r.keterangan || "-"}</td>
                            <td class="p-3 text-xs">${r.di_sertifikat || "-"}</td>
                            <td class="p-3 text-xs text-gray-700">${r.hasil_ai || "-"}</td>
                        </tr>
                    `).join('')}
                </tbody>
            </table>
        </div>`;
    });
    container.innerHTML = html;
}

// 4. MENGAMBIL DATA (Stitcher Payload)
async function fetchAndRender() {
    try {
        // Ganti URL ini dengan URL webhook yang mengembalikan data Sheets
        const response = await fetch("https://n8.waruna-group.co.id/webhook/audit-dokumen-final"); // Sesuaikan URL
        const rows = await response.json();
        
        // Asumsi data yang diambil adalah baris terakhir
        const row = rows[rows.length - 1]; 
        
        let fullPayloadStr = "";
        for(let i = 1; i <= 10; i++) {
            if (row["Payload" + i]) fullPayloadStr += row["Payload" + i];
        }

        if (fullPayloadStr) {
            renderCertificateReport(JSON.parse(fullPayloadStr));
        } else {
            document.getElementById("status-display").innerHTML = "⚠️ Payload di Sheets kosong.";
        }
    } catch (err) {
        document.getElementById("status-display").innerHTML = "❌ Error Fetching: " + err.message;
        console.error(err);
    }
}

// Jalankan otomatis
window.onload = fetchAndRender;
</script>
</body>
</html>
