<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Waruna Group | Dynamic Multi-Certificate Audit</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Inter', sans-serif; font-size: 11px; background: #f1f5f9; padding: 20px; }
        .cert-block { background: #fff; border: 1px solid #e2e8f0; border-radius: 8px; margin-bottom: 30px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); overflow: hidden; }
        .cert-header { background: #1e3a8a; color: #fff; padding: 12px 15px; font-weight: 800; text-transform: uppercase; display: flex; justify-content: space-between; }
        table { width: 100%; border-collapse: collapse; }
        th { background: #f8fafc; padding: 10px; font-size: 10px; border-bottom: 2px solid #e2e8f0; text-transform: uppercase; }
        td { border-bottom: 1px solid #e2e8f0; padding: 10px; }
        .tag-rn { background: #fef9c3; border: 1px solid #facc15; padding: 2px 6px; border-radius: 4px; font-weight: 800; color: #854d0e; font-size: 9px; }
        .tag-ok { background: #dcfce7; border: 1px solid #bbf7d0; padding: 2px 6px; border-radius: 4px; font-weight: 800; color: #166534; font-size: 9px; }
    </style>
</head>
<body>

<div id="container" class="max-w-5xl mx-auto">
    </div>

<script>
// Simulasi Data: Ganti ini dengan variabel data dari API n8n Anda
function renderCertificateReport(data) {
    const container = document.getElementById("container");
    const certGroups = {};

    // 1. Grouping Dinamis (Vendor Agnostic)
    data.tabel_audit.forEach(row => {
        let certNo = (row.certificate_no || "UNKNOWN-CERT").trim();
        if (!certGroups[certNo]) certGroups[certNo] = [];
        certGroups[certNo].push(row);
    });

    // 2. Render Kartu Per Sertifikat
    let html = "";
    Object.keys(certGroups).forEach(cNo => {
        html += `
        <div class="cert-block">
            <div class="cert-header">
                <span>📋 NOMOR SERTIFIKAT: ${cNo}</span>
                <span>TOTAL ITEM: ${certGroups[cNo].length}</span>
            </div>
            <table>
                <thead>
                    <tr><th>NO</th><th>ITEM INSPEKSI</th><th>QTY</th><th>EXPIRY</th><th>AUDIT AI</th></tr>
                </thead>
                <tbody>
                    ${certGroups[cNo].map((r, i) => `
                        <tr>
                            <td>${i + 1}</td>
                            <td>
                                <div class="font-bold">${r.keterangan}</div>
                                ${r.di_sertifikat.includes('RN') ? '<span class="tag-rn">STATUS: RENEWAL (RN)</span>' : '<span class="tag-ok">STATUS: REGULER (OK)</span>'}
                            </td>
                            <td>${r.di_sertifikat.split('|')[0]}</td>
                            <td>${r.di_sertifikat.split('|')[1]}</td>
                            <td class="text-[10px] text-gray-600">${r.hasil_ai}</td>
                        </tr>
                    `).join('')}
                </tbody>
            </table>
        </div>`;
    });
    container.innerHTML = html;
}

// Jalankan fungsi ini saat data sudah diterima dari n8n
// renderCertificateReport(dataFromWebhook);
</script>
</body>
</html>
