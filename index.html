<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Waruna Group | Verifikasi Dokumen</title>
    <style>
        :root {
            --primary:       #3730a3;
            --primary-dark:  #312e81;
            --primary-hl:    #c7d2fe;
            --primary-surf:  #e0e7ff;
            --surface:       #f3f4f6;
            --surface-2:     #ffffff;
            --success:       #166534;
            --success-surf:  #dcfce7;
            --success-hl:    #86efac;
            --error:         #991b1b;
            --error-surf:    #fee2e2;
            --error-hl:      #fca5a5;
            --text:          #1f2937;
            --text-muted:    #4b5563;
            --text-faint:    #9ca3af;
            --border:        #e5e7eb;
            --radius-md:     0.5rem;
            --radius-lg:     0.75rem;
            --radius-xl:     1rem;
            --radius-full:   9999px;
            --shadow-sm:     0 1px 2px rgba(0,0,0,0.05);
            --shadow-md:     0 4px 6px -1px rgba(0,0,0,0.1);
            --t:             0.2s ease;
            --max-w:         80rem;
        }
        [data-theme="dark"] {
            --surface: #111827; --surface-2: #1f2937; --text: #f9fafb;
            --text-muted: #d1d5db; --text-faint: #6b7280; --border: #374151;
        }
        *, *::before, *::after { box-sizing: border-box; }
        body { background:var(--surface); color:var(--text); font-family:system-ui,-apple-system,sans-serif; margin:0; min-height:100vh; display:flex; flex-direction:column; }

        /* HEADER & MAIN */
        .app-header { display:flex; justify-content:space-between; align-items:center; background:var(--surface-2); padding:1rem 1.5rem; box-shadow:var(--shadow-sm); border-bottom:1px solid var(--border); }
        .brand { display:flex; align-items:center; gap:.75rem; }
        .brand-logo { background:var(--primary); color:#fff; border-radius:var(--radius-md); padding:.25rem; display:flex; align-items:center; justify-content:center; }
        .brand-name { font-weight:700; font-size:1.1rem; color:#ca8a04; }
        .brand-name span { color:var(--text-faint); font-weight:400; }
        main { padding:2.5rem 1rem; display:flex; flex-direction:column; align-items:center; flex-grow:1; gap:1.5rem; }
        .page-title { text-align:center; }
        .page-title h1 { font-size:1.5rem; font-weight:700; margin:0 0 .5rem; }
        .page-title p { color:var(--text-muted); font-size:.875rem; margin:0; }

        /* UPLOAD CARD */
        .upload-card { background:var(--surface-2); border-radius:var(--radius-xl); padding:2rem; box-shadow:var(--shadow-md); width:100%; max-width:var(--max-w); border:1px solid var(--border); }
        .upload-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:1.5rem; margin-bottom:1.5rem; }
        .upload-zone { border:2px dashed var(--primary-hl); border-radius:var(--radius-lg); padding:1.5rem; text-align:center; transition:all var(--t); background:var(--surface-2); }
        .upload-zone.has-file { border-color:var(--success-hl); background:var(--success-surf); border-style:solid; }
        .uz-icon { display:flex; justify-content:center; margin-bottom:.75rem; color:var(--primary-hl); }
        .upload-zone.has-file .uz-icon { color:var(--success); }
        .uz-label { display:block; font-weight:700; color:#a16207; font-size:.8rem; text-transform:uppercase; margin-bottom:1rem; }
        .file-input { display:block; width:100%; font-size:.875rem; color:var(--text-muted); cursor:pointer; }
        .file-input::file-selector-button { display:block; width:100%; text-align:center; margin-bottom:.5rem; padding:.4rem 1rem; border-radius:var(--radius-md); border:none; font-weight:700; font-size:.75rem; background:var(--primary-surf); color:var(--primary); cursor:pointer; }
        .file-badge { display:none; margin-top:.75rem; font-size:.8rem; background:var(--surface-2); border:1px solid var(--success-hl); border-radius:.25rem; padding:.35rem .6rem; word-break:break-all; }
        .file-badge.show { display:block; }
        .file-badge strong { color:var(--success); }
        .btn-run { width:100%; background:var(--primary); color:#fff; font-weight:700; font-size:.875rem; padding:1rem; border-radius:var(--radius-lg); border:none; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:.5rem; text-transform:uppercase; box-shadow:var(--shadow-sm); }
        .btn-run:disabled { opacity:.5; cursor:not-allowed; }

        /* LOADING & ERRORS */
        .loading-box, .error-box { display:none; background:var(--surface-2); border-radius:var(--radius-xl); padding:2rem; text-align:center; width:100%; max-width:var(--max-w); box-shadow:var(--shadow-sm); border:1px solid var(--border); }
        .loading-box.show, .error-box.show { display:block; }
        .error-box { background:var(--error-surf); border-color:var(--error-hl); color:var(--error); text-align:left; font-weight:500; border-left:4px solid var(--error); }
        .spinner { width:48px; height:48px; margin:0 auto 1.25rem; border:3px solid var(--primary-hl); border-top-color:var(--primary); border-radius:var(--radius-full); animation:spin .9s linear infinite; }
        @keyframes spin { to { transform:rotate(360deg); } }

        /* RESULT & TABLE STYLES (EXCEL LOOK) */
        #result { width:100%; max-width:var(--max-w); display:flex; flex-direction:column; gap:1rem; }
        .status-banner { border-radius:var(--radius-xl); padding:1.25rem 1.5rem; text-align:center; }
        .status-banner.ok { background:var(--success-surf); border:1px solid var(--success-hl); }
        .status-banner.err { background:var(--error-surf); border:1px solid var(--error-hl); }
        .status-banner .sb-label { font-size:.7rem; font-weight:700; text-transform:uppercase; margin-bottom:.4rem; color:var(--text-muted); }
        .status-banner .sb-title { font-size:1.125rem; margin:0; font-weight:700; color:var(--text); }
        
        .summary-bar { display:flex; align-items:center; gap:.75rem; background:var(--surface-2); border:1px solid var(--border); border-radius:var(--radius-lg); padding:.875rem 1.25rem; font-size:.875rem; flex-wrap:wrap; }
        .filter-tabs { display:flex; gap:.5rem; margin-left:auto; }
        .ftab { font-size:.75rem; font-weight:600; padding:.3rem .85rem; border-radius:var(--radius-full); border:1px solid var(--border); background:var(--surface); color:var(--text-muted); cursor:pointer; }
        .ftab.active { background:var(--primary); color:#fff; border-color:var(--primary); }

        .table-wrap { overflow-x: auto; background: var(--surface-2); border-radius: var(--radius-lg); box-shadow: var(--shadow-sm); border: 1px solid var(--border); }
        .anomali-table { min-width: 1050px; width: 100%; border-collapse: collapse; }
        .anomali-table th, .anomali-table td { padding: 0.6rem 1rem; text-align: left; font-size: 0.85rem; border: 1px solid var(--border); vertical-align: middle; }
        .anomali-table thead tr { background: #e5e7eb; }
        [data-theme="dark"] .anomali-table thead tr { background: #374151; }
        
        /* Group Header (Kuning Ala Excel) */
        .group-header td { background: #fef08a !important; color: #854d0e !important; font-weight: 700; font-size: 0.95rem; }
        [data-theme="dark"] .group-header td { background: #854d0e !important; color: #fef08a !important; }

        .item-row { transition: background var(--t); }
        .item-row:nth-child(even) { background: var(--surface); }
        
        /* Anomali Row */
        .tr-warn td.td-anomali { background: #fee2e2; color: #991b1b; font-weight: 600; }
        [data-theme="dark"] .tr-warn td.td-anomali { background: #7f1d1d; color: #fca5a5; }

        .center { text-align: center !important; }
        .td-ai { font-size: 0.8rem; color: var(--text-muted); font-style: italic; }
        
        /* Teks Merah Untuk Detail Alat */
        .txt-red { color: #dc2626 !important; font-weight: 500; }
        [data-theme="dark"] .txt-red { color: #f87171 !important; }

        @media (max-width:640px) { .upload-grid{grid-template-columns:1fr;} }
    </style>
</head>
<body>

<header class="app-header">
    <div class="brand">
        <div class="brand-logo"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 2L2 7l10 5 10-5-10-5z"></path><path d="M2 17l10 5 10-5"></path><path d="M2 12l10 5 10-5"></path></svg></div>
        <span class="brand-name">Waruna Group <span>| Verifikasi Dokumen</span></span>
    </div>
</header>

<main>
    <div class="page-title">
        <h1>Audit &amp; Verifikasi Dokumen Vendor</h1>
        <p>Upload Quotation, Sertifikat, dan DO/Surat Jalan untuk diverifikasi silang oleh AI secara otomatis.</p>
    </div>

    <div class="upload-card">
        <div class="upload-grid">
            <div class="upload-zone" id="zone-p">
                <span class="uz-label">📄 Quotation / Invoice</span>
                <input type="file" id="file-penawaran" class="file-input" accept="application/pdf">
                <div class="file-badge" id="fbadge-p"><strong id="fname-p">—</strong></div>
            </div>
            <div class="upload-zone" id="zone-s">
                <span class="uz-label">📄 Laporan Sertifikat</span>
                <input type="file" id="file-sertifikat" class="file-input" accept="application/pdf">
                <div class="file-badge" id="fbadge-s"><strong id="fname-s">—</strong></div>
            </div>
            <div class="upload-zone" id="zone-d">
                <span class="uz-label">📄 Surat Jalan / DO</span>
                <input type="file" id="file-do" class="file-input" accept="application/pdf">
                <div class="file-badge" id="fbadge-d"><strong id="fname-d">—</strong></div>
            </div>
        </div>
        <button type="button" id="btn-run" class="btn-run">Jalankan Verifikasi Ekstraksi</button>
    </div>

    <div class="loading-box" id="loading">
        <div class="spinner"></div>
        <p class="loading-title" id="loading-txt">Mengunggah Dokumen...</p>
    </div>
    <div class="error-box" id="err-box"></div>
    <div id="result"></div>
</main>

<script>
function bindFile(inId,zoneId,nameId,badgeId){
    var inp=document.getElementById(inId); if(!inp) return;
    inp.addEventListener("change",function(){
        if(this.files.length){
            document.getElementById(nameId).textContent=this.files[0].name;
            document.getElementById(badgeId).classList.add("show");
            document.getElementById(zoneId).classList.add("has-file");
        }
    });
}
bindFile("file-penawaran","zone-p","fname-p","fbadge-p");
bindFile("file-sertifikat","zone-s","fname-s","fbadge-s");
bindFile("file-do","zone-d","fname-d","fbadge-d");

var pollInt=null;
var WH_SUBMIT="https://n8.waruna-group.co.id/webhook/audit-dokumen";
var WH_POLL  ="https://n8.waruna-group.co.id/webhook/check-status-audit";

function lockUI(txt){
    document.getElementById("btn-run").disabled=true;
    document.getElementById("result").innerHTML="";
    document.getElementById("err-box").classList.remove("show");
    document.getElementById("loading").classList.add("show");
    document.getElementById("loading-txt").textContent=txt;
}
function unlockUI(){
    document.getElementById("btn-run").disabled=false;
    document.getElementById("loading").classList.remove("show");
}
function showErr(msg){ clearInterval(pollInt); unlockUI(); var e=document.getElementById("err-box"); e.innerHTML="<strong>Kesalahan:</strong> "+msg; e.classList.add("show"); }
function esc(s){ return String(s||"-").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

document.getElementById("btn-run").addEventListener("click", async function(){
    var pI=document.getElementById("file-penawaran"), sI=document.getElementById("file-sertifikat"), dI=document.getElementById("file-do");
    if(!pI.files.length || !sI.files.length || !dI.files.length) return showErr("Ketiga dokumen wajib diunggah.");
    
    var jobId="JOB-"+Date.now();
    var fd=new FormData();
    fd.append("penawaran",pI.files[0]); fd.append("sertifikat",sI.files[0]); fd.append("surat_jalan",dI.files[0]); fd.append("job_id",jobId);
    
    lockUI("Sedang Mengirim & Memproses AI (Tunggu 1-3 Menit)...");
    
    try {
        var res=await fetch(WH_SUBMIT,{method:"POST",body:fd});
        if(!res.ok) throw new Error("Server error HTTP "+res.status);
        pollInt=setInterval(function(){ poll(jobId); }, 10000);
    } catch(e){ showErr(e.message); }
});

async function poll(jobId){
    try {
        var res=await fetch(WH_POLL+"?job_id="+jobId);
        if(!res.ok) return;
        var txt=await res.text();
        if(!txt || txt.trim().charAt(0)==="<") return;
        var data=JSON.parse(txt);
        if(data.status==="processing") return;
        
        var rows = Array.isArray(data) ? data : (data.data || [data]);
        var ourRow = rows.find(r => r["Job ID"] === jobId || r["job_id"] === jobId);
        if(!ourRow) return;
        
        clearInterval(pollInt); unlockUI();
        
        var parsed={};
        try{ parsed=JSON.parse(ourRow["Payload"]||"{}"); }catch(e){ return showErr("Gagal membaca hasil JSON."); }
        render(parsed);
    } catch(e){}
}

function render(parsed){
    var c=document.getElementById("result"); c.innerHTML="";
    var isOk = parsed.status_keseluruhan==="ALL_MATCH";

    c.innerHTML += `
        <div class="status-banner ${isOk ? 'ok' : 'err'}">
            <h2 class="sb-title">${isOk ? '✅ Semua Dokumen Sesuai' : '⚠️ Ditemukan Ketidaksesuaian'}</h2>
        </div>
        <div class="summary-bar">
            <div class="filter-tabs">
                <button class="ftab active" data-filter="all">Tampilkan Semua</button>
                <button class="ftab" data-filter="warn">⚠️ Hanya Anomali</button>
                <button class="ftab" data-filter="ok">✅ Hanya Sesuai</button>
            </div>
        </div>
    `;

    var tw = document.createElement("div"); tw.className="table-wrap";
    var html = `<table class="anomali-table">
        <thead>
            <tr>
                <th style="width:50px" class="center">No</th>
                <th style="width:25%">Keterangan</th>
                <th style="width:15%" class="center">Final Quotation / Invoice</th>
                <th style="width:20%" class="center">Sertifikat</th>
                <th style="width:15%" class="center">Delivery Order / BA</th>
                <th style="width:20%">Hasil AI</th>
            </tr>
        </thead>
        <tbody>`;

    if(parsed.tabel_audit && parsed.tabel_audit.length > 0) {
        var currCat = "";
        var no = 1;
        var rom = ['i','ii','iii','iv','v','vi','vii','viii','ix','x','xi','xii','xiii','xiv','xv','xvi','xvii'];

        parsed.tabel_audit.forEach(function(row){
            if(row.kategori !== currCat) {
                html += `<tr class="group-header"><td colspan="6">${esc(row.kategori)}</td></tr>`;
                currCat = row.kategori;
                no = 1;
            }
            var isWarn = row.hasil_ai && row.hasil_ai.indexOf('⚠') !== -1;
            var cls = isWarn ? "tr-warn" : "tr-ok";
            var tdAno = isWarn ? "td-anomali" : "";
            
            // Penomoran seperti Excel: Angka (1,2), Huruf (a,b), Romawi Merah (i,ii)
            var isAntar = currCat.toLowerCase().indexOf("antar") !== -1;
            var isCekLembar = currCat.toLowerCase().indexOf("semua") !== -1 || currCat.toLowerCase().indexOf("lembar") !== -1;
            var noStr = isAntar ? no : (isCekLembar ? String.fromCharCode(96+no) : (rom[no-1]||no));
            var redCls = (!isAntar && !isCekLembar) ? "txt-red" : "";
            
            html += `<tr class="item-row ${cls}">
                <td class="center ${redCls}"><b>${noStr}</b></td>
                <td class="${redCls}">${esc(row.keterangan)}</td>
                <td class="${tdAno} center">${esc(row.di_penawaran)}</td>
                <td class="${tdAno} center">${esc(row.di_sertifikat)}</td>
                <td class="${tdAno} center">${esc(row.di_do)}</td>
                <td class="td-ai">${esc(row.hasil_ai)}</td>
            </tr>`;
            no++;
        });
    }
    html += `</tbody></table>`;
    tw.innerHTML = html;
    c.appendChild(tw);

    // Filter Logic
    document.querySelectorAll(".ftab").forEach(function(btn){
        btn.addEventListener("click",function(){
            document.querySelectorAll(".ftab").forEach(b => b.classList.remove("active"));
            this.classList.add("active");
            var f = this.dataset.filter;
            
            document.querySelectorAll('.item-row').forEach(function(row){
                if(f === 'all') row.style.display = '';
                else if(f === 'warn') row.style.display = row.classList.contains('tr-warn') ? '' : 'none';
                else if(f === 'ok') row.style.display = row.classList.contains('tr-ok') ? '' : 'none';
            });
            
            // Sembunyikan Header Kuning Jika isinya kosong
            document.querySelectorAll('.group-header').forEach(function(hdr){
                var show = false, next = hdr.nextElementSibling;
                while(next && !next.classList.contains('group-header')) {
                    if(next.style.display !== 'none') { show = true; break; }
                    next = next.nextElementSibling;
                }
                hdr.style.display = show ? '' : 'none';
            });
        });
    });
}
</script>
</body>
</html>
