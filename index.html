<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Waruna Group | Audit LSA V8</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: sans-serif; background: #f1f5f9; padding: 20px; }
        .cert-block { background: #fff; border: 1px solid #e2e8f0; border-radius: 8px; margin-bottom: 30px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
        .cert-header { background: #1e3a8a; color: #fff; padding: 12px; font-weight: bold; font-size: 12px; }
        table { width: 100%; border-collapse: collapse; }
        th { background: #f8fafc; padding: 10px; font-size: 10px; border-bottom: 2px solid #e2e8f0; text-align: left; text-transform: uppercase; }
        td { border-bottom: 1px solid #e2e8f0; padding: 10px; vertical-align: top; }
        .tag-rn { background: #fef9c3; color: #854d0e; padding: 2px 6px; border-radius: 4px; font-weight: 800; font-size: 9px; }
        .tag-ok { background: #dcfce7; color: #166534; padding: 2px 6px; border-radius: 4px; font-weight: 800; font-size: 9px; }
    </style>
</head>
<body>

<div id="container" class="max-w-5xl mx-auto">
    <div id="status-display" class="p-4 bg-blue-100 text-blue-800 rounded">Sedang memuat data dari database...</div>
</div>

<script>
// 1. FUNGSI RENDER UTAMA
function renderCertificateReport(data) {
    const container = document.getElementById("container");
    const statusEl = document.getElementById("status-display");
    
    if (!data || !data.tabel_audit) {
        statusEl.innerHTML = "❌ Data tidak ditemukan.";
        return;
    }

    statusEl.style.display = "none";
    const certGroups = {};
    data.tabel_audit.forEach(row => {
        let certNo = (row.certificate_no || "UNKNOWN-CERT").trim();
        if (!certGroups[certNo]) certGroups[certNo] = [];
        certGroups[certNo].push(row);
    });

    let html = "";
    Object.keys(certGroups).forEach(cNo => {
        html += `
        <div class="cert-block">
            <div class="cert-header">📋 NOMOR SERTIFIKAT: ${cNo}</div>
            <table>
                <thead><tr><th>NO</th><th>ITEM INSPEKSI</th><th>QTY / EXP</th><th>AUDIT AI</th></tr></thead>
                <tbody>
                    ${certGroups[cNo].map((r, i) => {
                        const split = r.di_sertifikat ? r.di_sertifikat.split('|') : ["-", "-"];
                        const isRN = r.di_sertifikat.toLowerCase().includes('rn') || r.di_sertifikat.toLowerCase().includes('renew');
                        return `
                        <tr>
                            <td>${i + 1}</td>
                            <td>
                                <div class="font-bold">${r.keterangan || "-"}</div>
                                ${isRN ? '<span class="tag-rn">STATUS: RENEWAL (RN)</span>' : '<span class="tag-ok">STATUS: REGULER (OK)</span>'}
                            </td>
                            <td class="text-xs">${split[0]}<br><small class="text-gray-500">${split[1] || ""}</small></td>
                            <td class="text-xs text-gray-700">${r.hasil_ai || "-"}</td>
                        </tr>`;
                    }).join('')}
                </tbody>
            </table>
        </div>`;
    });
    container.innerHTML = html;
}

// 2. FUNGSI PENGAMBILAN DATA (STITCHER)
async function init() {
    try {
        // Ganti URL ini dengan URL API/Webhook yang menuju ke data Sheets Anda
        const response = await fetch("https://n8.waruna-group.co.id/webhook/audit-dokumen-final");
        const rows = await response.json();
        const row = rows[rows.length - 1]; // Mengambil baris terakhir
        
        let fullPayloadStr = "";
        for(let i = 1; i <= 10; i++) {
            if (row["Payload" + i]) fullPayloadStr += row["Payload" + i];
        }

        if (fullPayloadStr) {
            renderCertificateReport(JSON.parse(fullPayloadStr));
        } else {
            document.getElementById("status-display").innerHTML = "⚠️ Payload kosong.";
        }
    } catch (err) {
        document.getElementById("status-display").innerHTML = "❌ Error: " + err.message;
        console.error(err);
    }
}

window.onload = init;
</script>
</body>
</html>
